[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-sentinel"
version = "0.1.0"
description = "Satellite-based oil-spill investigation and vessel-attribution system"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ocean Sentinel Team"}]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "shapely>=2.0,<3.0",
    "geojson>=3.0,<4.0",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.3,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
